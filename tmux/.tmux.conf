
# tmux configuration file 

## Enable Mouse Mode
set -g mouse on

## Access to System Clipboard
set -s set-clipboard on

## Remap Prefix from C-b to C-a
#unbind-key C-b
#set-option -g prefix C-a
#bind-key C-a send-prefix

## Key Bindings
# Bind Key "r" (prefix cntl-b r) to source .tmux.conf
bind-key r source-file ~/.tmux.conf \; display-message ".tmux.conf - reloaded"
# Session jumping with `fzf`
bind-key C-j display-popup -E "~/.config/tmux/session-fzf.sh"

# Use Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
 
# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v
bind-key | split-window -h
bind-key - split-window -v

## Status Bar Customization
# Change the color of the status line to blue with white text:
set -g status-style fg=blue,bg=black
set -g window-status-current-style fg=brightblue,bold
set -g status-justify centre

# Increase the statusbar left to show up to 30 characters
set-option -g status-left-length 30

# Change left side of the statusbar to the output of whoami command
set-option -g status-left "#[bg=black]#[fg=red]User:#(whoami)"
set-option -g status-right " #[fg=red,bg=black]%a%l:%M %p#[default] #[fg=red]%m-%d-%Y" 

# ------------- Plugins --------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# more plugins will go here
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
